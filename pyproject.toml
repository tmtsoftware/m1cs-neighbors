[project]
name = "neighbors"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kgillies", email = "kgjunk@mac.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
neighbors = "neighbors:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]
